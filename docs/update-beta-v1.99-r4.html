<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#d9eff1">
<title>Update SaNa Beta to v2.01</title>
<style>
body{margin:0;background:#d9eff1;color:#173e35;font:18px/1.5 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center}main{max-width:30rem;margin:20px;padding:24px;border:2px solid #91b7a2;border-radius:22px;background:#fffaf0}h1{font-size:28px;margin-top:0}button,a{display:inline-block;padding:12px 18px;margin:8px 8px 0 0;border:2px solid #91b7a2;border-radius:12px;background:#ffe17a;color:#173e35;font:700 17px system-ui;text-decoration:none}small{display:block;margin-top:18px}[hidden]{display:none!important}
</style>
<main>
<h1>SaNa Beta v2.01</h1>
<p id="progress" role="status" aria-live="polite">Preparing the puppy update…</p>
<button id="retry" type="button" hidden>Try again</button>
<a id="open-chrome" hidden>Open in Chrome</a>
<a href="beta/index.html">Open SaNa Beta</a>
<small id="chrome-note" hidden>Use Chrome to update the app installed from Chrome.</small>
<small>Your saved pictures and game settings stay on this device.</small>
</main>
<script>
// This page sits outside /beta/ so the old Beta worker cannot serve its cached welcome here.
(()=>{
  const appBase=new URL('./beta/',location.href),target='sana-little-hands-beta-v201-movable-cutouts';
  const progress=document.getElementById('progress'),retry=document.getElementById('retry');
  const android=/Android/i.test(navigator.userAgent),embeddedAndroid=android&&/(?:;\s*wv\b|Version\/4\.0)/i.test(navigator.userAgent);
  if(android){
    const self=new URL('update-beta-v2.01.html',location.href),chrome=document.getElementById('open-chrome');
    chrome.href='intent://'+self.host+self.pathname+'#Intent;scheme='+self.protocol.slice(0,-1)+';package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(self.href)+';end';
    chrome.hidden=false;document.getElementById('chrome-note').hidden=false;
  }
  const timed=(promise,ms=15000)=>new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('The update check took too long. Tap Try again. Your saved games are still available.')),ms);Promise.resolve(promise).then(value=>{clearTimeout(timer);resolve(value);},error=>{clearTimeout(timer);reject(error);});});
  function status(worker){return new Promise(resolve=>{
    if(!worker){resolve(null);return;}
    const channel=new MessageChannel(),timer=setTimeout(()=>{channel.port1.close();resolve(null);},5000);
    channel.port1.onmessage=event=>{clearTimeout(timer);channel.port1.close();resolve(event.data);};
    try{worker.postMessage({type:'OFFLINE_STATUS'},[channel.port2]);}catch{clearTimeout(timer);channel.port1.close();resolve(null);}
  });}
  function activated(worker){return new Promise((resolve,reject)=>{
    const done=error=>{clearTimeout(timer);worker.removeEventListener('statechange',check);error?reject(error):resolve();};
    const check=()=>{if(worker.state==='activated')done();else if(worker.state==='redundant')done(Error('The download did not finish. Please try again.'));};
    const timer=setTimeout(()=>done(Error('The games are still downloading. Keep this page open and try again.')),120000);
    worker.addEventListener('statechange',check);check();
  });}
  async function prepared(registration){
    const ready=await status(registration.active);
    if(!ready?.ready||ready.version!==target||!(await caches.keys()).includes(target))return false;
    const cache=await caches.open(target),page=await cache.match(new URL('index.html',appBase).href);
    if(!page)return false;
    const html=new DOMParser().parseFromString(await page.text(),'text/html');
    return html.querySelector('meta[name="sana-release"]')?.content===target&&Boolean(html.querySelector('[data-sana-puppy]'));
  }
  async function run(){
    retry.hidden=true;retry.disabled=true;
    try{
      if(!('serviceWorker'in navigator)||!window.isSecureContext)throw Error('Open this HTTPS page in Chrome or Safari to update SaNa Beta.');
      // One budget covers the whole check, including CacheStorage reads.
      let checkDeadline=performance.now()+15000;
      const checked=promise=>timed(promise,Math.max(1,checkDeadline-performance.now()));
      async function download(worker){
        if(!worker)return;
        progress.textContent='Downloading v2.01 games. Please keep this page open…';
        await activated(worker);
        checkDeadline=performance.now()+15000;
      }
      progress.textContent='Connecting to SaNa Beta…';
      // Always select Beta's exact scope, even though this browser page is outside it.
      const registration=await checked(navigator.serviceWorker.register(new URL('sw.js',appBase).href,{scope:appBase.href,updateViaCache:'none'}));
      if(registration.scope!==appBase.href)throw Error('The Beta update could not be selected. Please try again.');
      // An existing installation must be shown as Downloading before probing the old cache.
      await download(registration.installing||registration.waiting);
      progress.textContent='Checking the saved version…';
      if(!await checked(prepared(registration))){
        if(!navigator.onLine)throw Error('Connect to the internet, then try again.');
        progress.textContent='Requesting the puppy update…';
        if(!registration.installing&&!registration.waiting)await checked(new Promise((resolve,reject)=>{
          const found=()=>{registration.removeEventListener('updatefound',found);resolve();};
          registration.addEventListener('updatefound',found,{once:true});
          registration.update().then(()=>{registration.removeEventListener('updatefound',found);resolve();},error=>{registration.removeEventListener('updatefound',found);reject(error);});
        }));
        await download(registration.installing||registration.waiting);
        progress.textContent='Checking the downloaded puppy version…';
        if(!await checked(prepared(registration)))throw Error('The puppy update is not ready yet. Keep this page open and try again.');
      }
      // The updater is deliberately outside Beta's scope; the next navigation selects its active worker.
      progress.textContent='v2.01 is ready. Opening SaNa Beta…';location.replace(new URL('index.html',appBase).href);
    }catch(error){progress.textContent=error.message||'The update did not finish. Please try again.';retry.hidden=false;retry.disabled=false;}
  }
  retry.addEventListener('click',run);
  if(embeddedAndroid)progress.textContent='Tap Open in Chrome to update your home-screen Beta app.';
  else void run();
})();
</script>
</html>
