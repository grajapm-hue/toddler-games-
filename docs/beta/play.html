#app:not([data-view="home"]) .play-toolbar #play-options{flex:0 1 auto;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;background:transparent;border:0;padding:0;margin:0}

/* v0.89: keep the original button background; highlight only the muted icon. */
#sound[aria-pressed="false"],#music-toggle[aria-pressed="false"]{
  background:#ffd4d4!important;color:#d31324!important;
  border-color:#a89a62!important;box-shadow:0 3px 0 #dfd3bb!important;
  position:relative!important;
}

}

  pointer-events:none;z-index:3;
}
#sound[aria-pressed="true"],#music-toggle[aria-pressed="true"]{

#music-toggle svg,#sound svg{width:24px;height:24px;display:block;flex:none}

/* v1.03: shared top-of-play-room item/progress strip in every activity. */
#app:not([data-view="home"]) .play-mat>.item-progress-strip:not([hidden]){
 display:flex!important;order:-5!important;flex:0 0 auto!important;align-items:center;gap:5px;
 min-height:42px;max-height:48px;padding:3px 8px;overflow-x:auto;overflow-y:hidden;
 white-space:nowrap;touch-action:pan-x;overscroll-behavior-x:contain;
 background:#fff1d4;border-bottom:2px solid #b8976b;scrollbar-width:thin;z-index:3;
}
.item-progress-strip[hidden]{display:none!important}
.item-chip{position:relative;display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;
 min-width:40px;height:34px;gap:4px;padding:2px 6px;border:2px solid #bda277;border-radius:9px;
 background:#fff9ea;color:#24483d;font-size:14px;font-weight:900;box-sizing:border-box}
.item-chip svg{height:27px;width:27px;flex:none;overflow:visible}
.item-chip.is-current{border:3px solid #e1a900;background:#ffe58a}
.item-chip.is-done{border-color:#32835a;background:#d2f3d9}
.item-chip.is-done::after{content:'✓';font-size:12px;color:#fff;background:#27834d;
 position:absolute;top:-3px;right:-3px;border-radius:50%;width:15px;height:15px;text-align:center;line-height:15px}
.item-chip.is-later{opacity:.45}
#app[data-view="brush"] .play-mat>.brush-thumbnails{display:none!important}

/* SVG drag board's legacy thumbnail row is hidden; the shared strip replaces it. */

#app.immersive .play-mat>.item-progress-strip:not([hidden]){display:flex!important;order:-5!important;max-height:48px!important}
#app.immersive .game-status-top{display:none!important}
@media(max-width:700px){.item-chip{min-width:35px;height:32px;font-size:12px;padding:2px 4px}}

/* v1.03 — exclusive age choice, compact header, no dropdown overlay. */
.parent-age{display:flex!important;align-items:center;gap:3px!important;flex:none!important;position:static!important}
.parent-age>span{display:inline!important;font-size:12px!important}
.age-radio{min-width:31px;height:34px;padding:2px 5px;border:2px solid #9ab4a6;border-radius:9px;background:#fff8e9;color:#21463a;font-size:16px;font-weight:900;line-height:1;cursor:pointer}

/* The available items are a single fitted row, never a scroll carousel. */
#app:not([data-view="home"]) .play-mat>.item-progress-strip:not([hidden]){overflow:hidden!important;touch-action:auto!important;gap:2px!important;padding:3px 4px!important;justify-content:stretch!important;white-space:nowrap!important}
.item-progress-strip .item-chip{flex:1 1 0!important;min-width:0!important;max-width:none!important;overflow:hidden!important;height:34px!important;padding:1px!important;font-size:clamp(8px,1vw,13px)!important;gap:1px!important;border-width:1px!important;border-radius:5px!important}
.item-progress-strip .item-chip svg{width:min(24px,90%)!important;height:min(24px,90%)!important;min-width:0!important}
.item-progress-strip .item-chip.is-done::after{font-size:9px!important;width:12px!important;height:12px!important;line-height:12px!important}

<script>
/* v1.04 beta: Web Audio buffer playback avoids HTMLMediaElement media cards.
   Preserve existing sound-master/music preference semantics. */
(()=>{'use strict';
const button=document.getElementById('music-toggle');
const track='./bgm-sana-v86.mp3';
let enabled=false;
try{enabled=localStorage.getItem('sanaMusicV1')==='on';}catch(e){}
let master=document.getElementById('sound').getAttribute('aria-pressed')==='true';
let context=null,buffer=null,source=null,gain=null,loading=null,offset=0,startedAt=0;
let generation=0;
function sync(){button.setAttribute('aria-pressed',String(enabled));button.setAttribute('aria-label',enabled?'Background music on':'Background music off');button.title=enabled?'Turn background music off':'Turn background music on';button.style.opacity='1';}
function desired(){return master&&enabled&&!document.hidden;}
function stop(){
  generation++;
  if(source){if(context&&buffer)offset=(offset+Math.max(0,context.currentTime-startedAt))%buffer.duration;try{source.stop();}catch(e){}try{source.disconnect();}catch(e){}source=null;}
}
async function load(){
  if(buffer)return buffer;
  if(!loading)loading=(async()=>{
    const response=await fetch(track);
    if(!response.ok)throw new Error('Music unavailable');
    const bytes=await response.arrayBuffer();
    if(!context)throw new Error('Audio context unavailable');
    buffer=await context.decodeAudioData(bytes);
    return buffer;
  })().catch(error=>{loading=null;throw error;});
  return loading;
}
async function play(){
  if(!desired()){stop();return;}
  if(source)return;
  const token=++generation;
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;
    if(!context){context=new AudioContextClass();gain=context.createGain();gain.gain.value=0.72;gain.connect(context.destination);}
    await context.resume();
    await load();
    if(token!==generation||!desired()||source)return;
    const node=context.createBufferSource();node.buffer=buffer;node.loop=true;node.connect(gain);
    startedAt=context.currentTime;node.start(0,offset%buffer.duration);source=node;
  }catch(error){/* Audio is optional; no HTML audio fallback that would recreate the notification. */}
}
function update(){if(desired())void play();else stop();}
button.addEventListener('click',()=>{enabled=!enabled;try{localStorage.setItem('sanaMusicV1',enabled?'on':'off');}catch(e){}sync();update();});
window.addEventListener('sana-sound-change',event=>{master=Boolean(event.detail?.enabled);update();});
document.addEventListener('visibilitychange',update);
window.addEventListener('pagehide',stop);
document.addEventListener('freeze',stop);
document.addEventListener('pointerdown',()=>{if(desired())void play();},{passive:true});
sync();
})();
</script>
