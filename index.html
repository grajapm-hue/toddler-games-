<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf2df">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SaNa · Little Hands</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;--ink:#24453e;--quiet:#6a786b;--paper:#fffaf0;--mint:#d6e9dd;--green:#287c60;--blue:#347f9d;--peach:#f0ac90;--yellow:#f6d66f;--line:#d9ccb0;--shadow:#cfbea0;font-family:"Trebuchet MS","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#e9dfcd;color:var(--ink)}button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}button,svg{-webkit-user-select:none;user-select:none}button:focus-visible,[tabindex]:focus-visible{outline:4px solid #215e97;outline-offset:3px}[hidden]{display:none!important}
#viewport{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at top,#f8f0df,#e1d2b6)}
#app{position:absolute;left:50%;top:50%;width:var(--frame-w,100vw);height:var(--frame-h,100dvh);transform:translate(-50%,-50%);transform-origin:center;background:var(--paper);border:2px solid #d5c6aa;border-radius:30px;box-shadow:0 12px 36px #51452618;display:grid;grid-template-rows:86px minmax(0,1fr) 88px;overflow:hidden}
#app.rotated{transform:translate(-50%,-50%) rotate(90deg)}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 26px;border-bottom:1px solid #e8dfcb;background:#fffaf0;z-index:2}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand-mark{width:48px;height:48px}.wordmark{font-size:25px;font-weight:900;letter-spacing:-1px;line-height:1}.brand small{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#798675;margin-top:6px}.icon-button{border:1px solid #d9cdb5;border-radius:15px;background:#fffdf6;box-shadow:0 3px 0 #dfd3bb;min-width:46px;height:46px;display:grid;place-items:center;padding:9px}.icon-button svg{width:24px;height:24px}.icon-button[aria-pressed="true"]{background:#dceade;border-color:#78a88a}.icon-button:active,.soft-button:active,.activity-card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.levels{display:flex;align-items:center;gap:6px;background:#eee9db;padding:5px;border-radius:17px;margin:0 auto}.level{min-height:43px;padding:7px 16px;border:2px solid transparent;border-radius:12px;background:transparent;font-weight:900;font-size:14px;white-space:nowrap}.level small{display:block;font-size:10px;font-weight:700;margin-top:2px;opacity:.75}.level[aria-pressed="true"]{background:#fffdf7;border-color:#bcbba5;box-shadow:0 2px 2px #706a4b18}.level[data-level="1"]{color:#368165}.level[data-level="2"]{color:#286f96}.level[data-level="3"]{color:#a35c36}
#home-view{min-height:0;display:grid;grid-template-rows:minmax(0,.85fr) minmax(0,1.15fr);padding:14px 36px 28px;gap:14px}.welcome{display:flex;align-items:center;justify-content:space-between;min-height:0;padding:0 20px 0 8px}.hello-badge{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#66816a;margin:0 0 10px}.welcome h1{font-size:clamp(34px,4.2vw,58px);font-weight:900;letter-spacing:-2.5px;line-height:1.05;margin:0 0 13px}.welcome p{font-size:17px;color:#72806d;line-height:1.5;margin:0}.welcome-art{width:38%;height:100%;max-height:240px;min-height:0;overflow:visible}.activity-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;min-height:0}.activity-card{--card:#e3ecdc;--edge:#b5ccb0;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:0;min-height:0;padding:18px 10px 17px;border:2px solid var(--edge);border-radius:25px;background:var(--card);box-shadow:0 6px 0 var(--edge);position:relative;transition:transform .15s}.activity-card:nth-child(2){--card:#fff0b7;--edge:#e3cc7a}.activity-card:nth-child(3){--card:#dceef3;--edge:#afccd3}.activity-card:nth-child(4){--card:#f9ddd0;--edge:#dfb6a2}.activity-card .card-art{width:90%;height:53%;max-height:160px;overflow:visible}.activity-card b{font-size:24px;letter-spacing:-.8px;margin-top:12px}.activity-card small{font-size:13px;margin-top:5px;color:#637568;font-weight:700}.card-arrow{position:absolute;right:12px;top:10px;font-size:22px;color:#55765c;opacity:.5}
#activity-view{min-height:0;display:grid;grid-template-rows:54px minmax(0,1fr) auto;padding:10px 28px 16px;gap:7px}.activity-heading{display:flex;align-items:center;gap:18px;padding:0 8px}.activity-heading h1{font-size:25px;letter-spacing:-.7px;margin:0}.activity-heading .step-note{font-size:13px;color:#74826d;margin-left:auto;font-weight:700}.mode-switch{display:flex;gap:5px;padding:4px;border:1px solid #ddd0b8;border-radius:14px;background:#f0e9dc;margin-left:auto}.mode-button{border:0;border-radius:10px;background:transparent;min-height:36px;padding:5px 13px;font-size:13px;font-weight:800}.mode-button[aria-pressed="true"]{background:#fffef9;box-shadow:0 2px 0 #d5c7ac}
.play-mat{position:relative;min-height:0;border:2px solid #ddd2bc;border-radius:25px;background:#f3f4e9;overflow:hidden;box-shadow:inset 0 2px 0 #fff,0 4px 0 #e0d5be}#scene{display:block;width:100%;height:100%;touch-action:none;overflow:hidden}.piece{cursor:grab}.piece:active{cursor:grabbing}.piece.selected{filter:drop-shadow(0 0 9px #f3c65c)}.target{cursor:pointer}.bubble{cursor:pointer}.bubble.allowed{filter:drop-shadow(0 4px 0 #315f6e19)}.bubble.disallowed{opacity:.83}.slider-handle{cursor:ew-resize}.guide-hand{pointer-events:none;animation:guideHand 1.7s ease-in-out infinite;filter:drop-shadow(0 3px 0 #0002)}@keyframes guideHand{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(35px);opacity:1}}#celebrate{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-start;gap:10px;pointer-events:none;padding-top:10px}#celebrate span{color:#deb73d;font-size:36px;animation:starHello 1.2s ease-out both}#celebrate span:nth-child(2){animation-delay:.08s;font-size:49px}#celebrate span:nth-child(3){animation-delay:.16s}@keyframes starHello{0%{transform:translateY(25px) scale(.3);opacity:0}30%{transform:translateY(0) scale(1.2);opacity:1}80%{opacity:1}100%{transform:translateY(-15px) scale(.9);opacity:0}}
.paint-tools{display:flex;justify-content:center;align-items:center;gap:12px;min-height:48px}.paint-color{width:38px;height:38px;border:4px solid #fffaf0;box-shadow:0 0 0 1px #d3c5ac,0 3px 0 #d3c5ac;border-radius:50%;background:var(--paint)}.paint-color[aria-pressed="true"]{box-shadow:0 0 0 3px #294f46,0 3px 0 #294f46}.paint-label{font-size:12px;font-weight:800;color:#7d8976;margin-right:5px}
.bottom-bar{display:flex;align-items:center;gap:13px;padding:10px 27px;border-top:1px solid #e8dfcb;background:#f8f0df}.sana-badge{width:48px;flex:0 0 48px;text-align:center}.sana-badge svg{width:43px;height:43px}.sana-badge small{display:block;font-size:9px;font-weight:900;margin-top:-1px;color:#728467}#hint{font-size:17px;font-weight:800;line-height:1.35;flex:1;min-width:0}.progress{display:flex;gap:6px;align-items:center;max-width:150px;flex-wrap:wrap}.progress i{display:block;width:12px;height:12px;border-radius:50%;background:#e0d7c0;border:1px solid #cbbb9a}.progress i.done{background:#6aab88;border-color:#4b8a67}.soft-button{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;border:1px solid #b6c8b2;background:#e0eadb;border-radius:14px;min-height:44px;padding:8px 15px;box-shadow:0 3px 0 #b6c8b2;font-weight:900;font-size:14px}.soft-button svg{width:23px;height:23px}.soft-button.secondary{background:#fffaf0;border-color:#d6c7aa;box-shadow:0 3px 0 #d6c7aa}
#app.compact{grid-template-rows:55px minmax(0,1fr) 60px;border-radius:16px}.compact .topbar{padding:5px 14px;gap:10px}.compact .brand-mark{width:35px;height:35px}.compact .wordmark{font-size:20px}.compact .brand small{font-size:8px;letter-spacing:1.5px;margin-top:4px}.compact .levels{padding:3px;gap:2px}.compact .level{padding:3px 12px;min-height:38px;font-size:12px}.compact .level small{font-size:8px}.compact .icon-button{width:40px;min-width:40px;height:40px;border-radius:12px}.compact #home-view{padding:8px 22px 14px;gap:6px;grid-template-rows:minmax(0,.55fr) minmax(0,1.45fr)}.compact .welcome{padding:0 6px}.compact .welcome h1{font-size:31px;letter-spacing:-1.3px;margin-bottom:5px}.compact .welcome p{font-size:12px}.compact .hello-badge{display:none}.compact .welcome-art{width:28%}.compact .activity-grid{gap:12px}.compact .activity-card{padding:7px 6px 10px;border-radius:17px;box-shadow:0 4px 0 var(--edge)}.compact .activity-card .card-art{height:58%;max-height:85px}.compact .activity-card b{font-size:19px;margin-top:5px;letter-spacing:-.5px}.compact .activity-card small{font-size:10px;margin-top:2px}.compact .card-arrow{font-size:15px;right:8px;top:6px}.compact #activity-view{padding:4px 16px 8px;grid-template-rows:32px minmax(0,1fr) auto;gap:3px}.compact .activity-heading h1{font-size:19px}.compact .step-note{font-size:10px}.compact .mode-switch{padding:2px}.compact .mode-button{font-size:11px;min-height:26px;padding:3px 12px}.compact .play-mat{border-radius:17px}.compact .bottom-bar{padding:4px 17px;gap:10px}.compact .sana-badge{width:35px;flex-basis:35px}.compact .sana-badge svg{width:32px;height:32px}.compact .sana-badge small{font-size:8px}.compact #hint{font-size:13px}.compact .soft-button{font-size:12px;min-height:39px;padding:6px 11px;border-radius:12px}.compact .progress i{width:9px;height:9px}.compact .progress{gap:4px;max-width:85px}.compact .paint-tools{gap:10px;min-height:36px}.compact .paint-color{width:29px;height:29px;border-width:3px}.compact .paint-label{font-size:10px}
.narrow .brand-copy,.narrow .step-note,.narrow .soft-button .button-label{display:none}.narrow .brand{margin-right:0}.narrow .level{padding-left:9px;padding-right:9px}.narrow .topbar{gap:7px}.narrow .bottom-bar{gap:8px}.narrow .activity-card small{display:none}.narrow .activity-card b{font-size:17px}.narrow .progress{display:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true"><defs>
<symbol id="monkey" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#f3d56f"/><circle cx="21" cy="49" r="16" fill="#96634f"/><circle cx="79" cy="49" r="16" fill="#96634f"/><circle cx="21" cy="49" r="9" fill="#f2b5a0"/><circle cx="79" cy="49" r="9" fill="#f2b5a0"/><path d="M20 48Q20 13 50 17Q82 13 81 49L75 71Q50 88 25 71Z" fill="#96634f"/><path d="M28 42Q29 25 48 37Q67 23 74 43L73 67Q50 84 28 66Z" fill="#f7d2b3"/><circle cx="38" cy="47" r="4" fill="#293f35"/><circle cx="63" cy="47" r="4" fill="#293f35"/><circle cx="37" cy="46" r="1.3" fill="white"/><circle cx="62" cy="46" r="1.3" fill="white"/><ellipse cx="50" cy="58" rx="5" ry="3.5" fill="#b87d64"/><path d="M38 65Q50 77 63 65" stroke="#775044" fill="none" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="29" cy="59" rx="6" ry="4" fill="#eeac94"/><ellipse cx="72" cy="59" rx="6" ry="4" fill="#eeac94"/><path d="M45 18Q35 3 52 8Q61 5 60 17" fill="#96634f"/></symbol>
<symbol id="home-icon" viewBox="0 0 32 32"><path d="M4 15L16 5L28 15M8 13V27H24V13M13 27V19H19V27" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="sound-icon" viewBox="0 0 32 32"><path d="M5 12H11L18 6V26L11 20H5Z" fill="currentColor"/><path d="M22 11Q28 16 22 21M26 7Q35 16 26 25" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
<symbol id="fullscreen-icon" viewBox="0 0 32 32"><path d="M4 12V5H11M21 5H28V12M28 21V28H21M11 28H4V21" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="again-icon" viewBox="0 0 32 32"><path d="M8 10A11 11 0 1 1 5 20M8 3V11H16" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="hand-icon" viewBox="0 0 32 32"><path d="M11 17V7Q11 3 15 4Q17 4 17 7V16L20 13L26 16Q29 18 27 24L23 29H14L6 20Q4 16 7 15Z" fill="currentColor" opacity=".85"/></symbol>
</defs></svg>
<div id="viewport"><div id="app" data-view="home">
<header class="topbar">
  <button class="icon-button" id="home" type="button" aria-label="Home"><svg aria-hidden="true"><use href="#home-icon"/></svg></button>
  <div class="brand"><svg class="brand-mark" aria-hidden="true"><use href="#monkey"/></svg><div class="brand-copy"><div class="wordmark">SaNa</div><small>little hands</small></div></div>
  <div class="levels" role="group" aria-label="Play level">
    <button class="level" type="button" data-level="1" aria-label="Explore level" aria-pressed="false">Explore<small>little steps</small></button>
    <button class="level" type="button" data-level="2" aria-label="Play level, ages 2 to 4" aria-pressed="true">Play<small>ages 2–4</small></button>
    <button class="level" type="button" data-level="3" aria-label="Challenge level" aria-pressed="false">Challenge<small>extra fun</small></button>
  </div>
  <button class="icon-button" id="sound" type="button" aria-label="Sound off" aria-pressed="false"><svg aria-hidden="true"><use href="#sound-icon"/></svg></button>
  <button class="icon-button" id="fullscreen" type="button" aria-label="Fullscreen"><svg aria-hidden="true"><use href="#fullscreen-icon"/></svg></button>
</header>
<main id="home-view">
  <div class="welcome"><div><p class="hello-badge">a little world of discovery</p><h1>Come, let’s play.</h1><p>Curious fingers. Wonderful little discoveries.</p></div>
    <svg class="welcome-art" viewBox="0 0 380 210" aria-hidden="true"><ellipse cx="193" cy="180" rx="146" ry="15" fill="#e6e8d6"/><path d="M49 165Q32 78 119 62Q154 2 227 34Q312 30 333 107Q365 179 271 180H96Z" fill="#dcebdc"/><path d="M76 163Q87 123 104 122Q125 150 122 177M274 179Q269 135 292 117Q308 144 294 179" fill="#80ab87"/><circle cx="301" cy="41" r="24" fill="#f1cf65"/><path d="M301 8V1M301 81V74M268 41H260M342 41H335M277 16L271 10M326 66L332 72" stroke="#e5bc47" stroke-width="4" stroke-linecap="round"/><g transform="translate(118 42) scale(1.35)"><use href="#monkey" width="100" height="100"/></g><path d="M60 120Q43 101 55 90Q73 86 75 111Q89 98 96 112Q91 128 72 128" fill="#edaa91"/><path d="M71 127V169" stroke="#728f6e" stroke-width="4"/><circle cx="319" cy="154" r="8" fill="#e9b9a7"/><circle cx="307" cy="162" r="8" fill="#e9b9a7"/><circle cx="321" cy="169" r="8" fill="#e9b9a7"/><circle cx="320" cy="162" r="6" fill="#f4ce66"/></svg>
  </div>
  <div class="activity-grid" id="activity-grid"></div>
</main>
<main id="activity-view" hidden>
  <div class="activity-heading"><h1 id="activity-name">Shape picnic</h1><span class="step-note" id="step-note">Big shapes for little hands</span><div class="mode-switch" id="brush-modes" hidden><button type="button" class="mode-button" id="clean-mode" aria-label="Brush clean" aria-pressed="true">💧 Brush clean</button><button type="button" class="mode-button" id="paint-mode" aria-label="Finger paint" aria-pressed="false">🎨 Finger paint</button></div></div>
  <div class="play-mat"><svg id="scene" viewBox="0 0 1000 440" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Play area"></svg><div id="celebrate" hidden aria-hidden="true"><span>✦</span><span>✦</span><span>✦</span></div></div>
  <div class="paint-tools" id="paint-tools" hidden><span class="paint-label">Pick a color</span></div>
</main>
<footer class="bottom-bar">
  <div class="sana-badge" aria-hidden="true"><svg><use href="#monkey"/></svg><small>SaNa</small></div>
  <div id="hint" role="status" aria-live="polite" aria-atomic="true">Choose a picture. I’ll play with you!</div>
  <div class="progress" id="progress" aria-label="Activity progress" hidden></div>
  <button class="soft-button secondary" id="show-me" type="button" aria-label="Show me" hidden><svg aria-hidden="true"><use href="#hand-icon"/></svg><span class="button-label">Show me</span></button>
  <button class="soft-button" id="again" type="button" aria-label="Again" hidden><svg aria-hidden="true"><use href="#again-icon"/></svg><span class="button-label">Again</span></button>
</footer>
</div></div>
<script src="app.js"></script>
</body>
</html>
